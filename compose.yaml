# compose.yaml — deploiement local Automata (plan de conception, Phase 22).
#
# Prerequis : construire l'image avec `docker build -t automata:local .`
# (aucun contexte supplementaire n'est necessaire), ou remplacer `image:`
# par un `build: .` local — voir docs/deployment.md §3.
#
# IMPORTANT — mono-instance uniquement : NE PAS augmenter `replicas`/le
# nombre de repliques de ce service. La persistance (SQLite applicatif,
# store Amoxtli) est mono-ecrivain et le scheduler (Phase 16/18) utilise des
# verrous de concurrence en memoire, par processus : aucun verrouillage
# distribue n'est implemente. Plusieurs instances concurrentes du meme
# volume /data corrompraient la base ou dupliqueraient les executions
# planifiees.

services:
  automata:
    image: automata:local
    restart: unless-stopped
    volumes:
      - automata-data:/data
      - ./config:/config:ro
      - ./prompts:/prompts:ro
    environment:
      # Variables attendues par les references ${...} de config/config.yaml
      # (internal/config, expansion des variables d'environnement — voir
      # docs/deployment.md §2 pour un exemple complet). Adapter la liste a
      # la configuration reellement deployee ; ne jamais committer les
      # valeurs reelles ici, utiliser env_file (.env, non versionne) a la
      # place si prefere.
      MAIN_MODEL: ${MAIN_MODEL}
      MAIN_API_KEY: ${MAIN_API_KEY}
      MAIN_BASE_URL: ${MAIN_BASE_URL}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY}
      GOOGLE_CALENDAR_MCP_URL: ${GOOGLE_CALENDAR_MCP_URL}
      GOOGLE_CALENDAR_MCP_TOKEN: ${GOOGLE_CALENDAR_MCP_TOKEN}
      ALICE_WHATSAPP_ID: ${ALICE_WHATSAPP_ID}
      ORG_GROUP_CHANNEL_ID: ${ORG_GROUP_CHANNEL_ID}
      ORG_GROUP_CALENDAR_ID: ${ORG_GROUP_CALENDAR_ID}
      ALICE_PRIVATE_CHANNEL_ID: ${ALICE_PRIVATE_CHANNEL_ID}
      ALICE_CALENDAR_ID: ${ALICE_CALENDAR_ID}
    # La sonde de santé est définie dans l'image (directive HEALTHCHECK du
    # Dockerfile) et s'appuie sur la sous-commande `automata healthcheck`,
    # qui interroge GET /healthz/ready. Elle suppose observability.enabled à
    # true dans la configuration montée ; sinon, la surcharger ici par
    # `healthcheck: {disable: true}`.

volumes:
  automata-data:
