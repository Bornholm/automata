# Surveillance du développement local : `make watch`.
#
# Le processus porte le worker ET, si web.enabled est vrai, le serveur web
# d'administration/profil (internal/web) sur son adresse dédiée. La boucle
# régénère les vues (templ + tailwind), recompile, puis relance le
# processus, configuration et secrets rechargés au passage ; le serveur web
# libère son port à l'arrêt propre (Shutdown 5 s).

# Exclusions d'abord : sans elles, modd surveille les dépendances vendorisées et
# les données d'exécution, épuise les quotas d'inotify, et cesse silencieusement
# de détecter quoi que ce soit.
!vendor/**
!data/**
!bin/**
!tools/**
# Le worker écrit ses bases et sa session Courier sous le répertoire de
# configuration locale : les surveiller ferait redémarrer le processus à chaque
# écriture, donc en boucle sans fin.
!local/**/data/**
!local/**/*.sqlite*
!local/**/*.bleve/**
# Artefacts générés par `make web-generate` : les surveiller referait
# tourner la boucle une fois de plus après chaque régénération.
!internal/**/*_templ.go
!internal/web/assets/app.css

cmd/**/*.go
internal/**/*.go
# Vues et tokens du serveur web : leur modification passe par la
# régénération templ/tailwind (prep ci-dessous) avant recompilation.
internal/**/*.templ
internal/web/tokens.css
# La configuration locale et ses secrets font partie des sources : les modifier
# doit relancer le worker, sinon on teste l'ancienne valeur sans le savoir. Les
# motifs de surveillance ne peuvent pas être paramétrés, contrairement aux
# commandes ci-dessous : on couvre donc les deux emplacements habituels,
# `config/` par défaut et `local/` pour une configuration alternative.
config/*.yaml
config/*.env
local/*.yaml
local/*.env
# Une montée de dépendance change le binaire sans toucher aux sources : sans
# ces deux fichiers, le worker continuerait de tourner sur l'ancienne version.
go.mod
go.sum
Makefile
modd.conf {
  prep: make web-generate
  prep: make watch-build
  # CONFIG_FILE et CONFIG_ENV sont exportés par le Makefile ; les valeurs par
  # défaut couvrent un `modd` lancé directement, sans passer par `make watch`.
  # `exec` remplace le shell par le worker : le signal d'arrêt de modd
  # l'atteint alors directement, et l'arrêt propre de signal.NotifyContext
  # s'exécute au lieu d'être court-circuité.
  daemon: set -o allexport && . "./${CONFIG_ENV:-config/config.env}" && set +o allexport && exec bin/automata -config "${CONFIG_FILE:-config/config.yaml}" 2>&1 | tee -a watch.log
}
