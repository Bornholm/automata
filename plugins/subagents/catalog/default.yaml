# Catalogue embarqué : les sous-agents proposés par défaut aux membres.
#
# Un exploitant qui veut le sien pointe SUBAGENTS_CATALOG sur son fichier ;
# celui-ci REMPLACE alors le catalogue embarqué, il ne s'y ajoute pas.
#
# Attention à ce qui est déposé ici : une entrée peut lancer un processus
# sur le serveur, avec les droits d'Automata. Y ajouter un serveur MCP
# engage la même confiance que déposer un binaire dans le répertoire des
# plugins.
agents:
  - name: netprobe
    description: >-
      checks whether a host, a port, a website or a certificate is reachable
      from the server, and diagnoses DNS, TLS and HTTP problems
    # Anglais : ce texte part au modèle.
    system_prompt: |
      You are a network diagnostics specialist. You answer questions such as
      "is example.com reachable?", "why does this certificate fail?" or
      "what does this domain resolve to?" by probing, never by guessing.

      Work like an engineer, not like a scanner:
      - Probe what the question is about, one target at a time. Do not sweep
        ranges or enumerate ports: the policy will refuse it, and it is not
        what was asked.
      - Report what you observed — the code, the latency, the certificate
        dates, the resolved addresses — and say plainly what it means.
      - When a probe is refused by the policy, say so and say which target
        was refused. That is an answer, not a failure to work around: do not
        retry with a variation of the same target.
      - You probe from the server, not from the user's machine. If that
        distinction matters to the answer, say it.
    max_tool_calls: 8
    servers:
      - name: netprobe
        transport: stdio
        version: "0.4.1"
        # Téléchargement vérifié : le plugin va chercher l'archive et
        # refuse tout ce dont le sha256 ne correspond pas au checksums.txt
        # de la release. Fonctionne dans l'image distroless, qui n'a ni
        # shell ni compilateur.
        install:
          fetch:
            url: https://github.com/Bornholm/netprobe-mcp/releases/download/v{{version}}/netprobe-mcp_{{version}}_{{os}}_{{arch}}.tar.gz
            checksums: https://github.com/Bornholm/netprobe-mcp/releases/download/v{{version}}/checksums.txt
            extract: netprobe-mcp
        # La politique est déclarée ici, pas laissée à celle du serveur :
        # la politique interne de netprobe n'autorise qu'une poignée
        # d'hôtes de diagnostic, et refuserait la quasi-totalité des
        # questions qu'on lui pose.
        command: ["{{bin}}/netprobe-mcp", "--config", "{{files}}/policy.yaml"]
        # Les sept outils sont des lectures : ils observent, ils ne
        # changent rien. Exiger un « confirmer » pour chaque ping rendrait
        # le sous-agent inutilisable, et la vraie barrière n'est pas là —
        # c'est la politique ci-dessous.
        read_only:
          - tcp_probe
          - http_probe
          - dns_probe
          - tls_diagnose
          - icmp_probe
          - probe_policy
          - probe_check_target
        files:
          # netprobe sonde DEPUIS LE SERVEUR : sans liste d'autorisation,
          # c'est un SSRF offert sur le réseau interne. Cette politique
          # autorise l'Internet public et refuse tout ce qui est local —
          # boucle locale, plages privées, lien-local, multicast, et le
          # point d'accès de métadonnées des fournisseurs cloud
          # (169.254.169.254), qui sert des identifiants d'instance.
          #
          # Un exploitant qui VEUT sonder son propre réseau interne le
          # décide en fournissant son catalogue : geste explicite, pas un
          # défaut permissif.
          policy.yaml: |
            server:
              transport: stdio
              name: netprobe-mcp
              shutdown_grace: 10s

            security:
              targets:
                deny: []
                allow:
                  - type: cidr
                    pattern: "0.0.0.0/0"
                    tools: ["tcp_probe", "http_probe", "dns_probe", "tls_diagnose", "icmp_probe", "probe_check_target"]
                    comment: "l'Internet public ; le filtrage réel est celui de la section network"

              network:
                block_private: true
                block_loopback: true
                block_link_local: true
                block_multicast: true
                block_unspecified: true
                block_cloud_metadata: true
                allow_ipv4: true
                allow_ipv6: false

              dns:
                resolvers: []
                timeout: 3s
                cache_ttl: 60s
                cache_max_entries: 1024
                max_addresses_per_name: 4

            limits:
              global: { rps: 5, burst: 10 }
              per_target: { rps: 0.5, burst: 3 }
              per_session: { rps: 2, burst: 5 }
              max_concurrent_probes: 4
              max_calls_per_session: 200

            probes:
              default_timeout: 10s
              max_timeout: 30s
              tcp:
                enabled: true
                max_read_bytes: 4096
              http:
                enabled: true
                max_body_bytes: 1048576
                max_returned_bytes: 4096
                allow_redirect: true
                max_redirects: 5
              dns:
                enabled: true
                allow_system_resolver: true
                restrict_query_names: true
                max_response_bytes: 4096
              tls:
                enabled: true
                default_port: 443
                handshake_timeout: 10s
                min_tls_version: "1.2"

            audit:
              enabled: true
              format: json
              output: stderr
              level: info
              # Les cibles sondées sont ce que la personne a demandé : elles
              # ne vont pas dans les journaux de l'exploitant.
              log_targets: false

            # Désactivé : le plugin peut lancer un processus par membre, et
            # deux se disputeraient le même port.
            metrics:
              enabled: false
