name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: fmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      # Les plugins sont des modules Go séparés : même traitement.
      - name: plugins
        run: |
          for p in caldav email pages workspace; do
            (cd plugins/$p && go vet ./... && go test -race ./...)
          done
      - run: cd pkg/pluginsdk && go vet ./... && go test -race ./...
  # La recette de release doit rester valide à chaque changement, pas
  # seulement au tag.
  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: check

  # L'image toolbox (serveur LeaSH + outils du plugin workspace) se
  # construit à chaque changement pour attraper un Dockerfile cassé, et
  # n'est poussée sur GHCR que depuis main (latest) ou un tag (version).
  # LibreOffice et les polices pèsent lourd : le cache de couches GHA évite
  # de tout réinstaller quand seuls les scripts ou les policies bougent.
  toolbox-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bornholm/leash-toolbox
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: misc/toolbox
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
