name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: fmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      # Les plugins sont des modules Go séparés : même traitement.
      - name: plugins
        run: |
          for p in caldav email pages workspace; do
            (cd plugins/$p && go vet ./... && go test -race ./...)
          done
      - run: cd pkg/pluginsdk && go vet ./... && go test -race ./...
  # La recette de release doit rester valide à chaque changement, pas
  # seulement au tag.
  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: check
