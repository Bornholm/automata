syntax = "proto3";
package automata.plugin.v1;
option go_package = "github.com/bornholm/automata/pkg/pluginsdk/proto";

// AutomataPlugin is the service every plugin binary implements. The host
// discovers plugins in a directory, starts each one as a subprocess
// (hashicorp/go-plugin) and drives it through these RPCs.
service AutomataPlugin {
  rpc Describe(DescribeRequest) returns (PluginDescriptor);
  rpc Initialize(InitializeRequest) returns (InitializeResponse);
  rpc ListTools(ListToolsInput) returns (ListToolsOutput);
  rpc CallTool(CallToolInput) returns (CallToolOutput);
  // ListSubAgents lets one plugin mount SEVERAL named sub-agents, chosen
  // per member: a catalogue the member picks from, rather than the single
  // sub-agent of the descriptor. The host calls it instead of ListTools
  // when the descriptor sets provides_sub_agents, once per turn — answer
  // from cached state, never by connecting to anything.
  rpc ListSubAgents(ListSubAgentsInput) returns (ListSubAgentsOutput);
  rpc WatchTriggers(WatchTriggersRequest) returns (stream TriggerEvent);
  // PutFile and GetFile move file bytes between the host and the plugin's
  // own storage. They exist because tool results are text and bounded: a
  // video never belongs in a CallTool result. The host only calls them
  // when the descriptor sets supports_files.
  rpc PutFile(stream PutFileChunk) returns (PutFileResult);
  rpc GetFile(GetFileRequest) returns (stream FileChunk);
  // PutEvent, DeleteEvent and ListEvents let a plugin stand in for the
  // host's own scheduled-event storage: when it provides one, a member's
  // reminders live in the plugin's backend (a CalDAV calendar, say)
  // instead of the reminders table. The host only calls them when the
  // descriptor sets provides_event_store.
  //
  // The plugin owns the schedule and the text; the host keeps the
  // delivery, and learns that an occurrence is due through a
  // TriggerEvent carrying deliver_text.
  rpc PutEvent(PutEventRequest) returns (PutEventResponse);
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
}

// AutomataHostService is served by the host over the gRPC broker. Note the
// deliberate absence of any plugin_name field: the host binds each broker
// connection to the plugin that established it, so a plugin can never read
// or write another plugin's data, whatever it sends.
service AutomataHostService {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc SaveConfig(SaveConfigRequest) returns (SaveConfigResponse);
  rpc ListConfigs(ListConfigsRequest) returns (ListConfigsResponse);
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc Notify(NotifyRequest) returns (NotifyResponse);
  // Object store: binary objects grouped in named collections, scoped to
  // (plugin, org, member) like configs and secrets. Bytes are NOT sealed at
  // rest by default — the store exists to hold content meant to be served
  // publicly, and must never receive a secret. Set PutObjectMetadata.sealed
  // for a member's own documents: the host then encrypts them at rest and
  // refuses to publish that collection. Streaming mirrors PutFile/GetFile:
  // 1 MiB slices under the gRPC message limit.
  rpc PutObject(stream PutObjectChunk) returns (PutObjectResult);
  rpc GetObject(GetObjectRequest) returns (stream GetObjectChunk);
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);
  rpc DeleteCollection(DeleteCollectionRequest) returns (DeleteCollectionResponse);
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc CopyCollection(CopyCollectionRequest) returns (CopyCollectionResponse);
  // PublishCollection exposes a collection under the host's public
  // /s/<slug> route. The slug is generated host-side, stays stable while
  // the publication exists, and dies the moment UnpublishCollection runs.
  rpc PublishCollection(PublishCollectionRequest) returns (PublishCollectionResponse);
  rpc UnpublishCollection(UnpublishCollectionRequest) returns (UnpublishCollectionResponse);
  rpc ListPublications(ListPublicationsRequest) returns (ListPublicationsResponse);
  // PreviewCollection mints a signed, short-lived URL serving a collection
  // under the host's /d/ route — a capability for the member's own eyes,
  // handed out in their private channel. Nothing becomes public and the
  // signing secret never reaches the plugin.
  rpc PreviewCollection(PreviewCollectionRequest) returns (PreviewCollectionResponse);
  // ShareFile mints a signed, expiring URL serving ONE file of the
  // plugin, under the host's /f/ route. It exists because messaging
  // attachments are capped far below what a workspace produces: a
  // 140 MB video has no other way back to the member who asked for it.
  //
  // The host streams the bytes from the plugin when the link is opened —
  // nothing is copied or stored — and the signing secret never reaches
  // the plugin. The file must exist: the plugin checks before asking.
  rpc ShareFile(ShareFileRequest) returns (ShareFileResponse);
}

message DescribeRequest {}

message PluginDescriptor {
  // name is the plugin's identity everywhere: activation, configs,
  // secrets, executor keys. It must be unique across loaded plugins and
  // must not collide with a configured agent name.
  string name = 1;
  string version = 2;
  // description is shown in the admin UI; any language.
  string description = 3;
  // sub_agent, when set, mounts a delegated agent on the orchestrator.
  SubAgentDescriptor sub_agent = 4;
  // permission_domain is the first segment of the permission required for
  // write tools: "email" yields "email.<scope>.write".
  string permission_domain = 5;
  // has_triggers tells the host to open WatchTriggers.
  bool has_triggers = 6;
  // supports_files tells the host the plugin implements PutFile/GetFile,
  // and that the sub-agent may be given the host-side file tools. A plugin
  // leaving it false is never called on those RPCs.
  bool supports_files = 7;
  // provides_event_store tells the host the plugin implements
  // PutEvent/DeleteEvent/ListEvents, and that it takes over the storage
  // of scheduled events for the members who configured it. A plugin
  // leaving it false is never called on those RPCs.
  //
  // Taking over is per member, not per organization: the host uses the
  // plugin only for members whose configuration says so, and falls back
  // to its own table for everyone else. Two plugins claiming the store
  // for the same member is a configuration error; the host takes the
  // first in activation order and logs the collision.
  bool provides_event_store = 8;
  // provides_sub_agents tells the host to mount the sub-agents returned by
  // ListSubAgents, per member, instead of the single sub_agent above. A
  // plugin setting it leaves sub_agent empty and is never called on
  // ListTools.
  bool provides_sub_agents = 9;
}

// NamedSubAgent is one entry of a plugin's sub-agent catalogue.
message NamedSubAgent {
  // name is what the model sees: it becomes delegate_to_<name>. It must
  // not collide with a configured agent, another plugin, or another entry
  // — the host skips a colliding entry, since two identical delegation
  // tools are indistinguishable to the model.
  string name = 1;
  SubAgentDescriptor sub_agent = 2;
  // tools are this sub-agent's tools. Two entries may expose the same tool
  // name: CallTool carries the sub-agent it belongs to.
  repeated ToolDescriptor tools = 3;
}

message ListSubAgentsInput {
  // ctx designates the member: answer with the entries THEY enabled.
  CallContext ctx = 1;
}
message ListSubAgentsOutput {
  repeated NamedSubAgent sub_agents = 1;
}

message SubAgentDescriptor {
  // system_prompt and description are sent to the LLM: English only.
  string system_prompt = 1;
  string description = 2;
  // max_sequential_tool_calls <= 0 keeps the host default.
  int32 max_sequential_tool_calls = 3;
}

message InitializeRequest {
  uint32 host_service_broker_id = 1;
}

message InitializeResponse {
  // http_ui_port is 0 when the plugin has no embedded UI.
  uint32 http_ui_port = 1;
  // ui_auth_token must accompany every proxied UI request
  // (X-Automata-UI-Token). It closes the loopback port to other local
  // processes.
  string ui_auth_token = 2;
}

// CallContext carries the identity of the turn. It is always built by the
// host, never by the model and never by the plugin. member_id is a trusted
// server-side identifier: it must never be echoed into any text destined
// to the LLM.
message CallContext {
  string org_id = 1;
  string member_id = 2;
  string scope = 3;
  string scope_id = 4;
  // idempotency_key is non-empty only when the call executes a confirmed
  // write action; replaying the same key must not repeat the side effect.
  string idempotency_key = 5;
}

message ToolDescriptor {
  string name = 1;
  // description is sent to the LLM: English only.
  string description = 2;
  // input_schema_json is a JSON Schema for the tool arguments.
  string input_schema_json = 3;
  // read_only tools execute directly during the turn. Anything not marked
  // read_only is treated as a write: it is never executed directly, only
  // proposed for human confirmation. Absence of annotation means write.
  bool read_only = 4;
  // timeout_seconds overrides the host's per-tool timeout for this tool.
  // 0 keeps the host default; the host caps whatever is asked.
  uint32 timeout_seconds = 5;
}

message ListToolsInput {
  // ctx lets the plugin tailor the tool set to the member's own settings
  // (e.g. a mailbox configured read-only exposes no send tool at all).
  CallContext ctx = 1;
}
message ListToolsOutput {
  repeated ToolDescriptor tools = 1;
}

message CallToolInput {
  CallContext ctx = 1;
  string name = 2;
  string arguments_json = 3;
  // sub_agent names the ListSubAgents entry the tool belongs to. Empty for
  // a plugin with a single sub-agent. It travels through the confirmation
  // of a write too: the host restores it before replaying the action.
  string sub_agent = 4;
}
message CallToolOutput {
  string result_text = 1;
  // is_error marks a business failure. The host relays it to the model as
  // a plain-text error result; it never aborts the turn.
  bool is_error = 2;
}

// PutFileChunk streams one file from the host to the plugin. The first
// chunk carries the metadata, every following chunk carries data.
message PutFileChunk {
  oneof payload {
    PutFileMetadata metadata = 1;
    bytes data = 2;
  }
}
message PutFileMetadata {
  CallContext ctx = 1;
  string filename = 2;
  string mime_type = 3;
  uint64 size = 4;
}
message PutFileResult {
  // path is where the plugin stored the file, expressed the way the
  // plugin's own tools expect to see it.
  string path = 1;
  // is_error marks a business failure (quota, unreachable backend). Like
  // CallToolOutput.is_error it is relayed to the model, never fatal.
  bool is_error = 2;
  string error_text = 3;
}

message GetFileRequest {
  CallContext ctx = 1;
  string path = 2;
}

// FileChunk streams one file from the plugin back to the host. The first
// chunk carries the metadata, every following chunk carries data.
message FileChunk {
  oneof payload {
    FileMetadata metadata = 1;
    bytes data = 2;
  }
}
message FileMetadata {
  string filename = 1;
  string mime_type = 2;
  uint64 size = 3;
}

// ScheduledEvent is one entry of a plugin-provided event store: the text
// to deliver and when to deliver it. It carries no delivery state
// (channel, attempts, sent or not) — that stays host-side, out of the
// user's calendar.
message ScheduledEvent {
  // id is the plugin's own identifier, opaque to the host. Empty when the
  // host asks for a creation; PutEvent answers with the assigned one.
  string id = 1;
  // text is delivered to the member as is. Private content.
  string text = 2;
  // fire_at_unix is the next occurrence, in UTC seconds.
  int64 fire_at_unix = 3;
  // recurrence is a standard 5-field cron expression, empty for a one-off
  // event. The host speaks cron everywhere; a plugin whose backend uses
  // another dialect (an iCalendar RRULE, say) translates it, and refuses
  // with is_error what it cannot express rather than storing an
  // approximation.
  string recurrence = 4;
  // timezone is the IANA name recurrence is evaluated in.
  string timezone = 5;
}

message PutEventRequest {
  CallContext ctx = 1;
  // event.id empty creates, set updates.
  ScheduledEvent event = 2;
}
message PutEventResponse {
  string id = 1;
  // is_error marks a business failure (backend unreachable, recurrence
  // not expressible). The host surfaces it and does NOT fall back to its
  // own table: an event silently scattered across two stores is worse
  // than a refusal the user can see.
  bool is_error = 2;
  string error_text = 3;
}

message DeleteEventRequest {
  CallContext ctx = 1;
  string id = 2;
}
message DeleteEventResponse {
  // found is false when the id designates nothing — not an error.
  bool found = 1;
  bool is_error = 2;
  string error_text = 3;
}

message ListEventsRequest {
  CallContext ctx = 1;
  // from_unix and to_unix bound the window, in UTC seconds. to_unix 0
  // means no upper bound.
  int64 from_unix = 2;
  int64 to_unix = 3;
}
message ListEventsResponse {
  repeated ScheduledEvent events = 1;
  bool is_error = 2;
  string error_text = 3;
}

message WatchTriggersRequest {}

// TriggerEvent asks the host to run the plugin's sub-agent for a member.
// The event designates, it never decides: the host re-checks that the
// plugin is active for org_id and that member_id belongs to that org.
message TriggerEvent {
  // id deduplicates redeliveries (the plugin re-emits after a reconnect).
  string id = 1;
  string org_id = 2;
  string member_id = 3;
  // kind names the event class, e.g. "email.received".
  string kind = 4;
  // agent_input is the instruction for the sub-agent: English only, and
  // free of private content (bodies travel through read tools during the
  // turn, not through the event).
  //
  // A triggered turn may legitimately end with nothing to say. The host
  // sends nothing when the sub-agent answers with the silence marker
  // (see pluginsdk.TriggerSilent): an event worth watching for is not
  // always an event worth interrupting someone for — a spam email is the
  // obvious case. Say so in agent_input, with the criteria that apply to
  // this kind of event; without it the sub-agent assumes it must always
  // report, and dutifully summarises the junk.
  string agent_input = 5;
  int64 occurred_at_unix = 6;
  // attributes must not carry private content: they may be logged.
  map<string, string> attributes = 7;
  // deliver_text, when non-empty, is sent to the member's channel word
  // for word: no sub-agent turn, no LLM, no rewording, and agent_input is
  // ignored. It is what a due reminder needs — running a model over a
  // note the user wrote themselves would cost a call and reword it.
  //
  // Being a message to a human it may carry private content, so unlike
  // agent_input it is never logged and has no language constraint.
  string deliver_text = 8;
}

// member_id == "" addresses the organization-level entry.
message GetConfigRequest {
  string org_id = 1;
  string member_id = 2;
}
message GetConfigResponse {
  string config_json = 1;
  bool found = 2;
}
message SaveConfigRequest {
  string org_id = 1;
  string member_id = 2;
  string config_json = 3;
}
message SaveConfigResponse {}

message ListConfigsRequest {}
message ListConfigsResponse {
  // Only entries of organizations where the plugin is currently active.
  repeated ConfigEntry entries = 1;
}
message ConfigEntry {
  string org_id = 1;
  string member_id = 2;
  string config_json = 3;
}

message GetSecretRequest {
  string org_id = 1;
  string member_id = 2;
  string key = 3;
}
message GetSecretResponse {
  string value = 1;
  bool found = 2;
}
message SetSecretRequest {
  string org_id = 1;
  string member_id = 2;
  string key = 3;
  string value = 4;
}
message SetSecretResponse {}
message DeleteSecretRequest {
  string org_id = 1;
  string member_id = 2;
  string key = 3;
}
message DeleteSecretResponse {}

// Notify sends an application-authored message (no LLM involved) to the
// member's private channel.
message NotifyRequest {
  string org_id = 1;
  string member_id = 2;
  string text = 3;
}
message NotifyResponse {}

// PutObjectChunk streams one object from the plugin to the host store.
// The first chunk carries the metadata, every following chunk carries
// data. Writing to an existing (collection, key) replaces the object.
message PutObjectChunk {
  oneof payload {
    PutObjectMetadata metadata = 1;
    bytes data = 2;
  }
}
message PutObjectMetadata {
  string org_id = 1;
  string member_id = 2;
  string collection = 3;
  string key = 4;
  // content_type is declarative; the host re-derives what it serves
  // publicly from the key's extension.
  string content_type = 5;
  // sealed asks the host to encrypt the object at rest. Use it for a
  // member's own documents; a sealed collection can never be published.
  bool sealed = 6;
}
message PutObjectResult {
  int64 size = 1;
}

message GetObjectRequest {
  string org_id = 1;
  string member_id = 2;
  string collection = 3;
  string key = 4;
}
// GetObjectChunk streams one object back to the plugin. The first chunk
// carries the metadata, every following chunk carries data. A missing
// object answers found=false and no data — not an error.
message GetObjectChunk {
  oneof payload {
    GetObjectMetadata metadata = 1;
    bytes data = 2;
  }
}
message GetObjectMetadata {
  string content_type = 1;
  int64 size = 2;
  bool found = 3;
}

message DeleteObjectRequest {
  string org_id = 1;
  string member_id = 2;
  string collection = 3;
  string key = 4;
}
message DeleteObjectResponse {
  bool deleted = 1;
}

message DeleteCollectionRequest {
  string org_id = 1;
  string member_id = 2;
  string collection = 3;
}
message DeleteCollectionResponse {
  int64 deleted = 1;
}

message ObjectEntry {
  string key = 1;
  string content_type = 2;
  // size is always the plaintext size, sealed or not.
  int64 size = 3;
  // updated_at is RFC3339 UTC.
  string updated_at = 4;
  bool sealed = 5;
}
message ListObjectsRequest {
  string org_id = 1;
  string member_id = 2;
  string collection = 3;
}
message ListObjectsResponse {
  repeated ObjectEntry entries = 1;
}

message ListCollectionsRequest {
  string org_id = 1;
  string member_id = 2;
  // prefix filters collections by literal prefix; empty lists them all.
  string prefix = 3;
}
message ListCollectionsResponse {
  repeated string collections = 1;
}

// CopyCollection replaces the target collection with a copy of the
// source, atomically. It is how a draft becomes the published version.
message CopyCollectionRequest {
  string org_id = 1;
  string member_id = 2;
  string from = 3;
  string to = 4;
}
message CopyCollectionResponse {
  int64 copied = 1;
}

message PublishCollectionRequest {
  string org_id = 1;
  string member_id = 2;
  string collection = 3;
}
message PublishCollectionResponse {
  string slug = 1;
  // url is the absolute public URL, composed by the host.
  string url = 2;
}

message UnpublishCollectionRequest {
  string org_id = 1;
  string member_id = 2;
  string collection = 3;
}
message UnpublishCollectionResponse {
  bool existed = 1;
}

message PreviewCollectionRequest {
  string org_id = 1;
  string member_id = 2;
  string collection = 3;
}
message PreviewCollectionResponse {
  // url is absolute and expires; expires_at is RFC3339 UTC.
  string url = 1;
  string expires_at = 2;
}

message ShareFileRequest {
  string org_id = 1;
  string member_id = 2;
  // path names the file the way the plugin's own tools express it.
  string path = 3;
}
message ShareFileResponse {
  // url is absolute and expires; expires_at is RFC3339 UTC.
  string url = 1;
  string expires_at = 2;
}

message Publication {
  string collection = 1;
  string slug = 2;
  string url = 3;
  // published_at is RFC3339 UTC.
  string published_at = 4;
}
message ListPublicationsRequest {
  string org_id = 1;
  string member_id = 2;
}
message ListPublicationsResponse {
  repeated Publication publications = 1;
}
