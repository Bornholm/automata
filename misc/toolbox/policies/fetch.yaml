# Policy « fetch » : téléchargement d'une vidéo publique dans le workspace
# d'un tenant, par yt-dlp encapsulé dans le script `fetch-video`.
#
# CETTE POLICY EST LA SEULE À OUVRIR LE RÉSEAU, et c'est tout son objet.
# Elle est le pendant volontairement étroit de la policy « toolbox », qui
# reste étanche (`unshare.network: true`) — condition posée pour y exécuter
# des commandes sans confirmation humaine. Deux clés API distinctes
# (LEASH_APIKEY_<NAME>_POLICY) permettent au même appelant d'utiliser l'une
# ou l'autre sur le MÊME workspace : on télécharge avec celle-ci, on édite
# avec l'autre.
#
# Garde-fous, dans l'ordre où ils comptent :
#
#  1. Des WRAPPERS seulement — jamais `yt-dlp` en direct, dont --exec et
#     les post-processeurs feraient un lanceur de commandes arbitraires
#     avec le réseau ouvert et le workspace monté en écriture. Aucun
#     interpréteur, aucun outil de fichiers, aucun `curl`/`wget` : un
#     script ne peut littéralement rien faire d'autre que télécharger.
#     Chaque wrapper ne fait qu'UNE chose et se relit d'un coup d'oeil ;
#     c'est cette relecture qui tient la frontière, pas leur nombre.
#  2. Les builtins du shell sont désactivés et les tubes/subshells réduits
#     au minimum : pas de composition qui contournerait le point 1.
#  3. Le script refuse tout ce qui n'est pas http(s) et tout hôte littéral
#     en IP ; la liste blanche de domaines est appliquée par l'appelant
#     (Automata), qui la tient de sa configuration d'exploitation.
#  4. Durée et sortie bornées comme ailleurs ; le plafond de taille est
#     dans le script (--max-filesize).
#
# Ne pas ajouter de binaire ici sans lui écrire son propre wrapper, aussi
# étroit que les deux existants : jamais un outil réseau généraliste, et
# jamais un wrapper paramétrable en options — ce serait rouvrir --exec par
# la bande. Cette liste est l'inventaire de ce que l'agent peut atteindre
# sur le réseau, et le fait qu'elle DOIVE changer pour qu'une capacité
# s'ajoute est le point de contrôle : une capacité qui s'ajouterait sans
# elle s'ajouterait sans revue.
#
# À savoir : yt-dlp lance lui-même `deno` pour exécuter le script de
# signature servi par YouTube. Ce sous-processus échappe à l'allowlist —
# qui ne filtre que les commandes du script, jamais les enfants d'un
# binaire autorisé (même situation que python3 sous ocrmypdf). C'est
# assumé : deno exécute ce JS tiers sans aucun accès au disque ni au
# réseau, et l'ensemble reste dans ce bac à sable.

execution:
  # Un téléchargement est plus long qu'une conversion : une vidéo d'une
  # heure en 1080p passe mal en 300 s sur une liaison lente.
  max_duration: 600s
  max_output_bytes: 262144
  # Une commande par script : il n'y a rien à composer ici. Le wrapper
  # appelé, lui, fait ce qu'il veut en interne — l'allowlist ne filtre que
  # la commande soumise, jamais les enfants d'un binaire autorisé.
  max_commands_per_script: 1
  max_subshells: 0

allowed_binaries:
  # Rapporte la vidéo, sous plafond de taille et de durée.
  - fetch-video
  # Rapporte les seuls sous-titres, sans jamais télécharger la vidéo :
  # quelques dizaines de kilo-octets de texte là où la vidéo en pèserait
  # des centaines de milliers, pour répondre à ce qu'elle DIT.
  - fetch-subtitles

blocked_patterns:
  - "rm -rf /"

environment:
  static:
    # Mêmes raisons que la policy toolbox : HOME en tmpfs, jamais dans le
    # workspace du membre. yt-dlp y écrirait sinon caches et cookies.
    HOME: /tmp
    PATH: /usr/local/bin:/usr/bin:/bin
    TMPDIR: /tmp
    # yt-dlp lance deno pour résoudre le défi de signature de YouTube.
    # Sans DENO_DIR explicite, deno écrirait son cache sous $HOME ; le
    # poser en tmpfs le rend jetable et le garde hors du workspace, comme
    # tout le reste ici.
    DENO_DIR: /tmp/deno

builtins:
  disabled: true

sandbox:
  enabled: true
  backend: bwrap
  readonly_binds:
    - /usr
    - /etc/alternatives
    # Sans les autorités de certification, tout https échoue.
    - /etc/ssl
    - /etc/ca-certificates
    # Résolution DNS : sans ces deux fichiers, aucun nom d'hôte ne se
    # résout dans le namespace.
    - /etc/resolv.conf
    - /etc/hosts
    - /etc/nsswitch.conf
  symlinks:
    - source: usr/bin
      target: /bin
    - source: usr/lib
      target: /lib
    - source: usr/lib/x86_64-linux-gnu
      target: /lib64
  tmpfs:
    - /tmp
  workdir: /work
  unshare:
    # LE réseau reste attaché — c'est l'unique différence avec « toolbox »,
    # et la raison d'être de ce fichier.
    network: false
    pid: true
    ipc: true
    uts: true
    user: true
  die_with_parent: true
  # yt-dlp écrit ses fragments dans /tmp avant de fusionner en mp4.
  persistent_tmp: true
